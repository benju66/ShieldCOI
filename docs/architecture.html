<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ShieldCOI — Architecture Map</title>
<style>
  :root{
    --bg:#0b1020; --bg2:#0f1629; --panel:#141c31; --panel2:#1a2542;
    --line:#25324f; --line2:#33436b; --text:#e6ecf7; --muted:#93a1bf;
    --muted2:#6b7a9c; --accent:#60a5fa; --accent2:#818cf8;
    --shadow:0 8px 30px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:radial-gradient(1200px 700px at 15% -5%, #16204090, transparent),
               radial-gradient(1000px 600px at 100% 0%, #1b143a70, transparent),
               var(--bg);
    color:var(--text);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  a{color:var(--accent)}
  .wrap{max-width:1500px;margin:0 auto;padding:22px 22px 80px}
  header.app{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:14px}
  .brand{display:flex;align-items:center;gap:13px}
  .logo{width:42px;height:42px;border-radius:11px;background:linear-gradient(135deg,#2563eb,#7c3aed);display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);font-size:20px}
  .brand h1{margin:0;font-size:19px;letter-spacing:.4px;font-weight:800}
  .brand .sub{color:var(--muted);font-size:12px;margin-top:2px;max-width:640px}
  .stats{display:flex;gap:10px;flex-wrap:wrap}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:8px 13px;min-width:82px}
  .stat b{display:block;font-size:19px;font-weight:800;line-height:1.1}
  .stat span{color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.6px}

  .tabs{display:flex;gap:6px;margin:8px 0 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .tab{background:none;border:0;color:var(--muted);font-weight:700;font-size:13px;padding:9px 14px;border-radius:9px 9px 0 0;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
  .tab:hover{color:var(--text);background:#ffffff08}
  .tab.active{color:var(--text);border-bottom-color:var(--accent)}

  .toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
  .toolbar .hint{color:var(--muted);font-size:12px}
  .btn{background:var(--panel);border:1px solid var(--line2);color:var(--text);border-radius:8px;padding:6px 11px;font-size:12px;font-weight:600;cursor:pointer}
  .btn:hover{background:var(--panel2)}
  .legend{display:flex;gap:7px;flex-wrap:wrap;margin-left:auto}
  .lg{display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:4px 10px 4px 8px;font-size:11.5px;font-weight:600;cursor:pointer;user-select:none;color:var(--muted)}
  .lg .dot{width:10px;height:10px;border-radius:50%}
  .lg.on{color:var(--text);border-color:var(--line2)}
  .lg.off{opacity:.4}

  /* Architecture canvas */
  .stage{position:relative}
  #edges{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1;overflow:visible}
  .bands{position:relative;z-index:2;display:flex;flex-direction:column;gap:14px}
  .band{border:1px solid var(--line);background:linear-gradient(180deg,#ffffff05,transparent);border-radius:14px;padding:12px 14px}
  .band-head{display:flex;align-items:center;gap:10px;margin-bottom:11px}
  .band-head .bar{width:4px;height:18px;border-radius:3px}
  .band-head h3{margin:0;font-size:13px;font-weight:800;letter-spacing:.3px}
  .band-head .blurb{color:var(--muted);font-size:11.5px}
  .nodes{display:flex;flex-wrap:wrap;gap:10px}
  .node{position:relative;background:var(--panel);border:1px solid var(--line2);border-left-width:3px;border-radius:10px;padding:9px 12px;cursor:pointer;min-width:150px;max-width:230px;transition:transform .12s ease,box-shadow .12s ease,border-color .12s}
  .node:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
  .node .nl{font-weight:700;font-size:12.5px;display:flex;align-items:center;gap:6px}
  .node .nt{color:var(--muted);font-size:10.5px;margin-top:2px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .node .badge{font-size:9px;text-transform:uppercase;letter-spacing:.5px;font-weight:800;padding:1px 6px;border-radius:20px;background:#ffffff12;color:var(--muted)}
  .node.dim{opacity:.16;filter:saturate(.4)}
  .node.hot{border-color:#fff;box-shadow:0 0 0 1px #ffffff40,var(--shadow)}
  .node.lit{opacity:1}

  /* Detail panel */
  .drawer{position:fixed;top:0;right:0;height:100%;width:min(430px,94vw);background:var(--bg2);border-left:1px solid var(--line2);box-shadow:-14px 0 40px rgba(0,0,0,.5);transform:translateX(100%);transition:transform .22s cubic-bezier(.4,0,.2,1);z-index:50;display:flex;flex-direction:column}
  .drawer.open{transform:translateX(0)}
  .drawer .dh{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  .drawer .dh h2{margin:0;font-size:16px;font-weight:800}
  .drawer .dh .path{color:var(--muted);font-size:11.5px;font-family:ui-monospace,Menlo,monospace;margin-top:4px;word-break:break-all}
  .drawer .db{padding:16px 18px;overflow:auto}
  .x{background:none;border:1px solid var(--line2);color:var(--muted);width:30px;height:30px;border-radius:8px;cursor:pointer;font-size:16px;flex-shrink:0}
  .x:hover{color:var(--text);background:var(--panel)}
  .sec{margin-bottom:16px}
  .sec h4{margin:0 0 7px;font-size:10.5px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted)}
  .sec p{margin:0;color:var(--text);font-size:13px}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{background:var(--panel);border:1px solid var(--line2);border-radius:7px;padding:3px 9px;font-size:11px;color:var(--muted)}
  .relbtn{display:flex;align-items:center;gap:7px;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 10px;margin-bottom:5px;cursor:pointer;color:var(--text);font-size:12px}
  .relbtn:hover{background:var(--panel2);border-color:var(--line2)}
  .relbtn .d{width:8px;height:8px;border-radius:50%;flex-shrink:0}
  .relbtn .a{margin-left:auto;color:var(--muted)}

  /* Data model */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px}
  .table-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .tc-head{background:linear-gradient(180deg,#2dd4bf22,transparent);padding:11px 14px;border-bottom:1px solid var(--line)}
  .tc-head h3{margin:0;font-size:14px;font-weight:800;font-family:ui-monospace,Menlo,monospace;display:flex;align-items:center;justify-content:space-between;gap:8px}
  .tc-head .ten{font-size:9.5px;text-transform:uppercase;letter-spacing:.5px;color:#2dd4bf;background:#2dd4bf1a;border:1px solid #2dd4bf33;padding:2px 7px;border-radius:20px;font-weight:800}
  .tc-rls{font-size:10.5px;color:var(--muted);margin-top:4px}
  .cols{padding:6px 0}
  .col{display:flex;align-items:baseline;gap:8px;padding:4px 14px;font-size:12px}
  .col .cn{font-family:ui-monospace,Menlo,monospace;color:var(--text);font-weight:600}
  .col .ct{color:var(--muted);font-size:11px;margin-left:auto;font-family:ui-monospace,Menlo,monospace}
  .col .kb{font-size:8.5px;font-weight:800;padding:1px 5px;border-radius:5px;text-transform:uppercase;letter-spacing:.4px}
  .kb.pk{background:#fbbf2422;color:#fbbf24;border:1px solid #fbbf2440}
  .kb.fk{background:#60a5fa22;color:#60a5fa;border:1px solid #60a5fa40}
  .col .note{display:block;color:var(--muted2);font-size:10px;font-style:italic;width:100%}
  .tc-note{padding:9px 14px;border-top:1px solid var(--line);color:var(--muted);font-size:11px;font-style:italic;background:#ffffff05}

  /* Flows */
  .flow{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:16px 18px;margin-bottom:14px}
  .flow h3{margin:0 0 12px;font-size:15px;font-weight:800;display:flex;align-items:center;gap:9px}
  .flow ol{margin:0;padding:0;list-style:none;counter-reset:s}
  .flow li{counter-increment:s;position:relative;padding:0 0 14px 40px;color:var(--text);font-size:13px}
  .flow li:before{content:counter(s);position:absolute;left:0;top:-2px;width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center}
  .flow li:after{content:"";position:absolute;left:12.5px;top:26px;bottom:2px;width:1.5px;background:var(--line2)}
  .flow li:last-child{padding-bottom:0}
  .flow li:last-child:after{display:none}

  .view{display:none}
  .view.active{display:block}
  footer{color:var(--muted2);font-size:11px;margin-top:26px;text-align:center}
  @media (max-width:700px){ .node{max-width:100%;flex:1 1 100%} }
</style>
</head>

<div class="wrap">
  <header class="app">
    <div class="brand">
      <div class="logo">🛡️</div>

        <h1>ShieldCOI · Architecture Map</h1>

  <div class="tabs">

    <button class="tab" data-view="data">Data Model</button>
    <button class="tab" data-view="flows">Data Flows</button>
  </div>

  <!-- ARCHITECTURE -->
  <section class="view active" id="view-arch">
    <div class="toolbar">
      <span class="hint">Click a node for details · hover to trace dependencies · toggle layers →</span>
      <button class="btn" id="resetBtn">Reset view</button>
      <div class="legend" id="legend"></div>
    </div>
    <div class="stage">
      <svg id="edges"></svg>
      <div class="bands" id="bands"></div>
    </div>
  </section>

  <!-- DATA MODEL -->
  <section class="view" id="view-data">
    <div class="toolbar"><span class="hint">Postgres schema — every table is org-scoped by Row-Level Security via <code>current_org_id()</code>.</span></div>
    <div class="grid" id="tables"></div>
  </section>

  <!-- FLOWS -->
  <section class="view" id="view-flows">
    <div class="toolbar"><span class="hint">The key end-to-end sequences through the system.</span></div>
    <div id="flows"></div>
  </section>

  <footer id="footer"></footer>
</div>

<!-- Detail drawer -->
<div class="drawer" id="drawer">
  <div class="dh">
    <div>
      <h2 id="dTitle"></h2>
      <div class="path" id="dPath"></div>
    </div>
    <button class="x" id="dClose">✕</button>
  </div>
  <div class="db" id="dBody"></div>
</div>

<script>
(function(){
  "use strict";
  var DATA = JSON.parse(document.getElementById("archData").textContent);
  var layerById = {}; DATA.layers.forEach(function(l){ layerById[l.id]=l; });
  var nodeById = {};  DATA.nodes.forEach(function(n){ nodeById[n.id]=n; });
  // Build reverse dependency (dependents) map
  var dependents = {};
  DATA.nodes.forEach(function(n){ (n.deps||[]).forEach(function(d){ (dependents[d]=dependents[d]||[]).push(n.id); }); });

  /* ---------- header ---------- */
  document.getElementById("subtitle").textContent = DATA.meta.tagline + " — " + DATA.meta.description;
  var stats = [
    ["Source files", DATA.nodes.filter(function(n){return n.loc>0;}).length + "+"],
    ["Lines of code", (DATA.meta.totalSourceLines||0).toLocaleString()],
    ["Layers", DATA.layers.length],
    ["DB tables", DATA.database.tables.length],
    ["Key flows", DATA.flows.length]
  ];
  document.getElementById("stats").innerHTML = stats.map(function(s){
    return '<div class="stat"><b>'+s[1]+'</b><span>'+s[0]+'</span></div>';
  }).join("");
  document.getElementById("footer").innerHTML =
    "Generated "+DATA.meta.generatedAt+" · "+DATA.meta.stack.join(" · ");

  /* ---------- legend / layer filter ---------- */
  var hidden = {};
  var legend = document.getElementById("legend");
  DATA.layers.forEach(function(l){
    var el = document.createElement("div");
    el.className = "lg on"; el.dataset.layer = l.id;
    el.innerHTML = '<span class="dot" style="background:'+l.color+'"></span>'+l.label;
    el.addEventListener("click", function(){
      hidden[l.id] = !hidden[l.id];
      el.classList.toggle("on", !hidden[l.id]);
      el.classList.toggle("off", !!hidden[l.id]);
      render();
    });
    legend.appendChild(el);
  });

  /* ---------- render bands + nodes ---------- */
  var bands = document.getElementById("bands");
  function render(){
    bands.innerHTML = "";
    DATA.layers.forEach(function(l){
      if(hidden[l.id]) return;
      var band = document.createElement("div");
      band.className = "band"; band.style.borderColor = l.color+"33";
      var nodesInLayer = DATA.nodes.filter(function(n){return n.layer===l.id;});
      band.innerHTML =
        '<div class="band-head">'+
          '<span class="bar" style="background:'+l.color+'"></span>'+
          '<h3 style="color:'+l.color+'">'+l.label+'</h3>'+
          '<span class="blurb">'+l.blurb+'</span>'+
        '</div>';
      var nl = document.createElement("div"); nl.className = "nodes";
      nodesInLayer.forEach(function(n){
        var node = document.createElement("div");
        node.className = "node"; node.dataset.id = n.id;
        node.style.borderLeftColor = l.color;
        node.innerHTML =
          '<div class="nl">'+n.label+' <span class="badge">'+n.type+'</span></div>'+
          (n.file ? '<div class="nt">'+shortPath(n.file)+'</div>' : '');
        node.addEventListener("click", function(e){ e.stopPropagation(); openNode(n.id); });
        node.addEventListener("mouseenter", function(){ hover(n.id); });
        node.addEventListener("mouseleave", clearHover);
        nl.appendChild(node);
      });
      band.appendChild(nl);
      bands.appendChild(band);
    });
    scheduleEdges();
  }
  function shortPath(p){ return p.replace(/^src\//,"").replace(/^supabase\//,""); }
  // Draw now + retry a couple of times. rAF can be deferred in a background/throttled
  // tab, so we don't rely on it alone — layout is usually ready synchronously anyway.
  function scheduleEdges(){
    drawEdges();
    if(window.requestAnimationFrame) requestAnimationFrame(drawEdges);
    setTimeout(drawEdges, 80);
    setTimeout(drawEdges, 300);
  }

  /* ---------- edges (SVG, computed from DOM positions) ---------- */
  var svg = document.getElementById("edges");
  var SVGNS = "http://www.w3.org/2000/svg";
  function center(id){
    var el = bands.querySelector('.node[data-id="'+id+'"]');
    if(!el) return null;
    var r = el.getBoundingClientRect(), s = svg.getBoundingClientRect();
    return { x: r.left - s.left + r.width/2, y: r.top - s.top + r.height/2, el: el };
  }
  function drawEdges(){
    var stage = document.querySelector(".stage");
    svg.setAttribute("width", stage.offsetWidth);
    svg.setAttribute("height", stage.offsetHeight);
    while(svg.firstChild) svg.removeChild(svg.firstChild);
    DATA.nodes.forEach(function(n){
      (n.deps||[]).forEach(function(d){
        var a = center(n.id), b = center(d);
        if(!a || !b) return;
        var col = (layerById[nodeById[d]?nodeById[d].layer:n.layer]||{}).color || "#33436b";
        var path = document.createElementNS(SVGNS,"path");
        var midY = (a.y+b.y)/2;
        path.setAttribute("d","M "+a.x+" "+a.y+" C "+a.x+" "+midY+" "+b.x+" "+midY+" "+b.x+" "+b.y);
        path.setAttribute("fill","none");
        path.setAttribute("stroke",col);
        path.setAttribute("stroke-width","1.1");
        path.setAttribute("stroke-opacity","0.16");
        path.dataset.from=n.id; path.dataset.to=d;
        svg.appendChild(path);
      });
    });
  }

  /* ---------- hover: trace connected ---------- */
  function connectedSet(id){
    var set = {}; set[id]=1;
    (nodeById[id].deps||[]).forEach(function(d){ set[d]=1; });
    (dependents[id]||[]).forEach(function(d){ set[d]=1; });
    return set;
  }
  function hover(id){
    var set = connectedSet(id);
    bands.querySelectorAll(".node").forEach(function(el){
      var on = set[el.dataset.id];
      el.classList.toggle("dim", !on);
      el.classList.toggle("hot", el.dataset.id===id);
    });
    svg.querySelectorAll("path").forEach(function(p){
      var on = (p.dataset.from===id || p.dataset.to===id);
      p.setAttribute("stroke-opacity", on ? "0.85" : "0.05");
      p.setAttribute("stroke-width", on ? "2" : "1");
    });
  }
  function clearHover(){
    bands.querySelectorAll(".node").forEach(function(el){ el.classList.remove("dim","hot"); });
    svg.querySelectorAll("path").forEach(function(p){ p.setAttribute("stroke-opacity","0.16"); p.setAttribute("stroke-width","1.1"); });
  }

  /* ---------- detail drawer ---------- */
  var drawer = document.getElementById("drawer");
  function openNode(id){
    var n = nodeById[id]; if(!n) return;
    var l = layerById[n.layer];
    document.getElementById("dTitle").textContent = n.label;
    document.getElementById("dTitle").style.color = l.color;
    document.getElementById("dPath").textContent = n.file || "";
    var deps = (n.deps||[]).filter(function(d){return nodeById[d];});
    var deps2 = (dependents[id]||[]).filter(function(d){return nodeById[d];});
    var html = "";
    html += '<div class="sec"><h4>Layer</h4><div class="chips"><span class="chip" style="border-color:'+l.color+'55;color:'+l.color+'">'+l.label+'</span><span class="chip">'+n.type+'</span></div></div>';
    html += '<div class="sec"><h4>Role</h4><p>'+n.role+'</p></div>';
    if(n.tech && n.tech.length) html += '<div class="sec"><h4>Tech</h4><div class="chips">'+n.tech.map(function(t){return '<span class="chip">'+t+'</span>';}).join("")+'</div></div>';
    html += relSection("Depends on ("+deps.length+")", deps);
    html += relSection("Used by ("+deps2.length+")", deps2);
    document.getElementById("dBody").innerHTML = html;
    document.getElementById("dBody").querySelectorAll(".relbtn").forEach(function(b){
      b.addEventListener("click", function(){ openNode(b.dataset.id); });
    });
    drawer.classList.add("open");
  }
  function relSection(title, ids){
    if(!ids.length) return '<div class="sec"><h4>'+title+'</h4><p style="color:var(--muted);font-size:12px">—</p></div>';
    var rows = ids.map(function(d){
      var nn = nodeById[d], ll = layerById[nn.layer];
      return '<button class="relbtn" data-id="'+d+'"><span class="d" style="background:'+ll.color+'"></span>'+nn.label+'<span class="a">'+ll.label+' ›</span></button>';
    }).join("");
    return '<div class="sec"><h4>'+title+'</h4>'+rows+'</div>';
  }
  document.getElementById("dClose").addEventListener("click", function(){ drawer.classList.remove("open"); });
  document.addEventListener("keydown", function(e){ if(e.key==="Escape") drawer.classList.remove("open"); });
  document.getElementById("resetBtn").addEventListener("click", function(){
    hidden={}; document.querySelectorAll(".lg").forEach(function(el){el.classList.add("on");el.classList.remove("off");});
    drawer.classList.remove("open"); render();
  });

  /* ---------- data model ---------- */
  var tablesEl = document.getElementById("tables");
  tablesEl.innerHTML = DATA.database.tables.map(function(t){
    var cols = t.columns.map(function(c){
      var kb = c.key ? (/PK/.test(c.key) ? '<span class="kb pk">'+c.key+'</span>' : '<span class="kb fk">'+c.key+'</span>') : "";
      return '<div class="col"><span class="cn">'+c.name+'</span>'+kb+'<span class="ct">'+c.type+'</span>'+
             (c.note ? '<span class="note">'+c.note+'</span>' : '')+'</div>';
    }).join("");
    return '<div class="table-card">'+
      '<div class="tc-head"><h3>'+t.name+'<span class="ten">'+t.tenancy+'</span></h3>'+
      '<div class="tc-rls">🔒 '+t.rls+'</div></div>'+
      '<div class="cols">'+cols+'</div>'+
      (t.note ? '<div class="tc-note">'+t.note+'</div>' : '')+
    '</div>';
  }).join("");

  /* ---------- flows ---------- */
  document.getElementById("flows").innerHTML = DATA.flows.map(function(f){
    return '<div class="flow"><h3>'+f.icon+' '+f.title+'</h3><ol>'+
      f.steps.map(function(s){return '<li>'+s+'</li>';}).join("")+'</ol></div>';
  }).join("");

  /* ---------- tabs ---------- */
  document.querySelectorAll(".tab").forEach(function(tab){
    tab.addEventListener("click", function(){
      document.querySelectorAll(".tab").forEach(function(t){t.classList.remove("active");});
      tab.classList.add("active");
      document.querySelectorAll(".view").forEach(function(v){v.classList.remove("active");});
      document.getElementById("view-"+tab.dataset.view).classList.add("active");
      if(tab.dataset.view==="arch") scheduleEdges();
    });
  });

  window.addEventListener("resize", scheduleEdges);
  window.addEventListener("load", scheduleEdges);
  document.addEventListener("visibilitychange", function(){ if(!document.hidden) scheduleEdges(); });
  render();
})();
</script>
</body>
</html>
